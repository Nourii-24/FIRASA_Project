<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D2B1E;
    --bg-deep: #081C13;
    --green: #1FA968;
    --green-soft: #3FC98A;
    --gold: #D4AF37;
    --gold-light: #E9CB6F;
    --gold-deep: #8A6A1E;
    --text: #F3EFE3;
    --text-dim: #A9B8AC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    color: var(--text);
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  .hero {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding: 28px 6vw 10px;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 22%, rgba(63,201,138,0.20) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 90%, rgba(212,175,55,0.12) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  }
  .starfield {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 25%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 55% 60%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 85% 70%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.3), transparent);
  }
  .eyebrow {
    font-size: 12.5px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--green-soft);
    font-weight: 500;
  }
  .title {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 1.5px;
    color: var(--gold-light);
    margin-top: 6px;
    text-shadow: 0 0 24px rgba(212,175,55,0.25);
  }
  .tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 19px;
    color: var(--gold-light);
    margin-top: 6px;
  }
  .stage {
    width: 380px;
    height: 300px;
    max-width: 90vw;
    margin: 30px auto 10px;
    perspective: 1600px;
    position: relative;
  }
  .glow-ring {
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.30) 0%, rgba(31,169,104,0.16) 45%, transparent 72%);
    filter: blur(18px);
    animation: pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.96); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  .card-mount {
    width: 320px;
    height: 198px;
    position: absolute;
    top: 50%; left: 50%;
    margin-top: -99px;
    margin-left: -160px;
    opacity: 0;
    animation:
      settle-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards,
      float 4.5s ease-in-out 1.25s infinite;
  }
  @keyframes settle-in {
    0%   { transform: scale(0.85) translateY(14px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  .card-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spin-once 4.4s cubic-bezier(0.45, 0.05, 0.35, 1) 0.3s 1 forwards;
  }
  @keyframes spin-once {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  .card-back, .card-front {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  .card-front { transform: rotateY(0deg); }
  .card-back  { transform: rotateY(180deg); }
  .card-back img, .card-front img {
    width: 100%;
    height: 100%;
    display: block;
  }
  .sparkle {
    position: absolute;
    width: 11px; height: 11px;
    background: var(--gold-light);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    animation: twinkle 2.2s ease-in-out infinite;
  }
  .sp1 { top: 8%;  left: 10%; animation-delay: 3.6s; }
  .sp2 { top: 78%; right: 6%; animation-delay: 4.3s; }
  .sp3 { bottom: 4%; left: 30%; animation-delay: 5.0s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .stat {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .stat-num {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 38px;
    font-weight: 700;
    color: var(--gold-light);
  }
  .stat-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="starfield"></div>
    <div class="eyebrow">Credit risk intelligence</div>
    <div class="title">Firasa</div>
    <div class="tagline">The sixth sense for credit risk.</div>

    <div class="stage">
      <div class="glow-ring"></div>
      <div class="card-mount">
        <div class="card-3d">
          <div class="card-front">
            <img src="data:image/png;base64,__FRONT_B64__" alt="Firasa card front"/>
          </div>
          <div class="card-back">
            <img src="data:image/png;base64,__BACK_B64__" alt="Firasa card back"/>
          </div>
        </div>
      </div>
      <div class="sparkle sp1"></div>
      <div class="sparkle sp2"></div>
      <div class="sparkle sp3"></div>
    </div>

    <div class="stat">
      <div class="stat-num" data-count="__CUSTOMER_COUNT__">0</div>
      <div class="stat-label">Customers monitored</div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.stat-num[data-count]').forEach(function(el) {
      var target = parseInt(el.getAttribute('data-count'), 10);
      var duration = 1400;
      var startTime = null;
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        var value = Math.round(eased * target);
        el.textContent = String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  </script>
</body>
</html>
