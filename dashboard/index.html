<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firasa | Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/firasa.css">
<style>
  :root {
    --bg: #0D2B1E;
    --bg-deep: #081C13;
    --green: #1FA968;
    --green-soft: #3FC98A;
    --gold: #D4AF37;
    --gold-light: #E9CB6F;
    --gold-deep: #8A6A1E;
    --text: #F3EFE3;
    --text-dim: #A9B8AC;
    /* card width scales with the screen but stays inside a laptop viewport */
    --cw: clamp(280px, min(40vw, 52vh), 560px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .topbar { position: absolute; top: 0; right: 0; left: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid rgba(212,175,55,0.18); flex-wrap: wrap; gap: 10px; }

  .hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 84px 6vw 28px;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 28%, rgba(63,201,138,0.20) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 82%, rgba(212,175,55,0.12) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  }
  .starfield {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(233,203,111,0.55), transparent),
      radial-gradient(1.5px 1.5px at 78% 12%, rgba(233,203,111,0.4), transparent),
      radial-gradient(1px 1px at 35% 82%, rgba(63,201,138,0.5), transparent),
      radial-gradient(1.5px 1.5px at 88% 65%, rgba(233,203,111,0.35), transparent),
      radial-gradient(1px 1px at 20% 55%, rgba(63,201,138,0.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 90%, rgba(233,203,111,0.3), transparent),
      radial-gradient(1px 1px at 50% 8%, rgba(233,203,111,0.4), transparent);
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { opacity: 0.6; transform: translateY(0); }
    100% { opacity: 1; transform: translateY(-10px); }
  }
  .eyebrow {
    font-size: clamp(12px, 1vw, 14px);
    font-weight: 500;
    letter-spacing: 3.5px;
    color: var(--green-soft);
    text-transform: uppercase;
    margin-bottom: clamp(6px, 1.4vh, 18px);
    opacity: 0.9;
  }
  .title {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(48px, min(6.2vw, 10.5vh), 92px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #F3EFE3 15%, var(--gold-light) 55%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    margin-top: clamp(6px, 1.5vh, 16px);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(26px, 2.5vw, 38px);
    color: var(--gold-light);
    max-width: 700px;
    line-height: 1.4;
  }

  .stage {
    width: calc(var(--cw) + 60px);
    height: calc(var(--cw) / 1.615 + 36px);
    margin: clamp(14px, 3.5vh, 46px) auto clamp(4px, 1.5vh, 26px);
    perspective: 1400px;
    position: relative;
  }
  .glow-ring {
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.30) 0%, rgba(31,169,104,0.16) 45%, transparent 72%);
    filter: blur(18px);
    animation: pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.96); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .card-mount {
    width: var(--cw);
    height: calc(var(--cw) / 1.615);
    position: absolute;
    top: 50%; left: 50%;
    margin-top: calc(var(--cw) / -3.23);
    margin-left: calc(var(--cw) / -2);
    opacity: 0;
    animation:
      settle-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards,
      float 4.5s ease-in-out 1.25s infinite;
  }
  @keyframes settle-in {
    0%   { transform: scale(0.85) translateY(14px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  .card-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spin-once 4.4s cubic-bezier(0.45, 0.05, 0.35, 1) 0.3s 1 forwards;
  }
  @keyframes spin-once {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  .card-back,
  .card-front {
    position: absolute;
    inset: 0;
    border-radius: calc(var(--cw) * 0.055);
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    -webkit-backface-visibility: hidden;
  }
  .card-front {
    transform: rotateY(0deg);
  }
  .card-back {
    transform: rotateY(180deg);
  }
  .card-back img,
  .card-front img {
    width: 100%;
    height: 100%;
    display: block;
  }
  .sparkle {
    position: absolute;
    width: 10px; height: 10px;
    background: var(--gold-light);
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    animation: twinkle 2.2s ease-in-out infinite;
  }
  .sp1 { top: 6%; left: 6%; animation-delay: 3.6s; }
  .sp2 { top: 80%; right: 4%; animation-delay: 4.3s; }
  .sp3 { bottom: 2%; left: 28%; animation-delay: 5.0s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .stat {
    margin-top: clamp(8px, 2vh, 22px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .stat-num {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(34px, 3.2vw, 48px);
    font-weight: 700;
    color: var(--gold-light);
  }
  .stat-label {
    font-size: clamp(12px, 1vw, 14px);
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .cta-group {
    margin-top: clamp(20px, 3.5vh, 34px);
    display: flex;
    justify-content: center;
  }
  .cta-btn {
    position: relative;
    gap: 10px;
    padding: 15px 38px;
    box-shadow: 0 0 24px rgba(212,175,55,0.18);
    transition: box-shadow 200ms ease, transform 200ms ease;
    border-radius: 999px;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, rgba(212,175,55,0.14), rgba(212,175,55,0.04));
    color: var(--gold-light);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    isolation: isolate;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    white-space: normal;
  }
  .cta-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3.2s ease-in-out infinite;
    z-index: -1;
  }
  .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 0 34px rgba(212,175,55,0.35); }
  @keyframes shimmer {
    0% { left: -60%; }
    45%, 100% { left: 130%; }
  }

  .hero > :not(.starfield) { position: relative; z-index: 2; }
  body .sky { z-index: 1; }
  footer {
    position: relative;
    z-index: 2;
    background: var(--bg-deep);
    text-align: center;
    padding: 22px 5vw 30px;
    font-size: 12px;
    color: var(--text-dim);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <div class="topbar">
    <a href="index.html" class="brand"><span class="mark">FIRASA</span><span class="page">The sixth sense for credit risk.</span></a>
    <div class="nav">
      <a href="index.html" class="active">Home</a>
      <a href="radar.html">Radar</a>
      <a href="profile.html">Customer Profile</a>
      <a href="manager.html">Manager Dashboard</a>
    </div>
  </div>

  <div class="hero">
    <div class="starfield"></div>
    <div class="eyebrow">Credit risk intelligence</div>
    <div class="title">Firasa</div>
    <div class="tagline">The sixth sense for credit risk.</div>

    <div class="stage">
      <div class="glow-ring"></div>
      <div class="card-mount">
        <div class="card-3d">
          <div class="card-front">
            <img src="assets/card_front.png" alt="" alt="Firasa card front"/>
          </div>
          <div class="card-back">
            <img src="assets/card_back.png" alt="" alt="Firasa card back"/>
          </div>
        </div>
      </div>
      <div class="sparkle sp1"></div>
      <div class="sparkle sp2"></div>
      <div class="sparkle sp3"></div>
    </div>

    <div class="stat">
      <div class="stat-num" data-count="8297">0</div>
      <div class="stat-label">Customers monitored</div>
    </div>

    <div class="cta-group">
      <a href="radar.html" class="cta-btn">Open the Radar</a>
    </div>
  </div>

  <footer>
    &copy; 2026 Firasa. Data Science Bootcamp project &mdash; SDA &amp; WeCloudData.
  </footer>


  <script>
    document.querySelectorAll('.stat-num[data-count]').forEach(function(el) {
      var target = parseInt(el.getAttribute('data-count'), 10);
      var suffix = el.getAttribute('data-suffix') || '';
      var duration = 1400;
      var startTime = null;
      function step(ts) {
        if (!startTime) startTime = ts;
        var progress = Math.min((ts - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        var value = Math.round(eased * target);
        el.textContent = String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + suffix;
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  </script>
<script src="assets/sky.js"></script>
</body>
</html>
